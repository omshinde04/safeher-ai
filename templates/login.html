<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SafeHer AI - Login & Access</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    :root {
      --bg-page: #f8fafc;
      --primary-indigo: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
      --font-heading: 'Outfit', -apple-system, sans-serif;
      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body.auth-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(at 0% 0%, #eef2ff 0px, transparent 45%),
        radial-gradient(at 100% 0%, #fdf2f8 0px, transparent 40%),
        radial-gradient(at 50% 100%, #f0fdf4 0px, transparent 40%);
      background-attachment: fixed;
      font-family: var(--font-main);
      color: #0f172a;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
      margin: auto 0;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 32px 26px;
      box-shadow: 0 10px 35px -5px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .auth-icon-badge {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff3366, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 12px auto;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.28);
    }
    .auth-title {
      font-family: var(--font-heading);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0f172a;
    }
    .auth-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
      font-weight: 500;
    }
    /* Segmented Tab Switcher (Sign In vs Sign Up) */
    .auth-nav-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 22px;
      border: 1px solid #e2e8f0;
    }
    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      text-decoration: none;
      border-radius: 9px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: block;
    }
    .auth-tab-btn.active {
      background: #ffffff;
      color: var(--primary-indigo);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    /* 16px input size is CRITICAL on iOS Safari to prevent auto-zoom */
    .auth-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      color: #0f172a;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }
    .auth-input::placeholder {
      color: #94a3b8;
      font-size: 14px;
    }
    .auth-input:focus {
      border-color: var(--primary-indigo);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .btn-submit {
      width: 100%;
      height: 48px;
      background: var(--primary-gradient);
      color: #ffffff;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
    }
    .btn-submit:hover, .btn-submit:active {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }
    .auth-footer a {
      color: var(--primary-indigo);
      font-weight: 700;
      text-decoration: none;
    }
    .alert-error {
      display: none;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-badge">🛡️</div>
        <h1 class="auth-title">SafeHer AI</h1>
        <p class="auth-sub">Smart Real-Time Safety & Protection</p>
      </div>

      <!-- Segmented Auth Tab Switcher -->
      <div class="auth-nav-tabs">
        <a href="/login" class="auth-tab-btn active">Sign In</a>
        <a href="/register" class="auth-tab-btn">Create Account</a>
      </div>

      <div id="login-error" class="alert-error"></div>

      <form id="form-login" method="POST" action="/api/auth/login">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" class="auth-input" required placeholder="name@example.com" autocomplete="username email" inputmode="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" class="auth-input" required placeholder="Enter your password" autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login-submit" class="btn-submit">
          <span>Sign In to SafeHer</span>
          <span>→</span>
        </button>
      </form>

      <div class="auth-footer">
        New to SafeHer? <a href="/register">Sign Up for free</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('form-login');
    const errBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('btn-login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await resp.json();

        if (data.success) {
          window.location.href = '/';
        } else {
          errBox.innerText = data.error || 'Invalid credentials. Please try again.';
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
        }
      } catch (err) {
        errBox.innerText = 'Network error. Please check connection.';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
